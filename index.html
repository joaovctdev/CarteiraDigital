<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b6e4f" />
    <title>Carteira Digital</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👛</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Banner de configuração inicial (some assim que a API_URL for preenchida) -->
    <div id="setup-banner" class="setup-banner" hidden>
      <p>
        <strong>Quase lá!</strong> Configure a URL do Google Apps Scriptt em
        <code>js/config.js</code> para conectar este site à sua planilha. Veja o
        passo a passo no <code>README.md</code>.
      </p>
    </div>

    <div id="app" class="app">
      <!-- Cabeçalho -->
      <header class="app-header">
        <div class="app-header__top">
          <div class="brand">
            <span class="brand__icon" aria-hidden="true">👛</span>
            <span class="brand__name">Carteira Digital</span>
          </div>
          <button
            id="period-toggle"
            class="period-toggle"
            type="button"
            aria-label="Filtrar por período"
          >
            <span id="period-label">Este mês</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M6 9l6 6 6-6"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div id="period-panel" class="period-panel" hidden>
          <input id="period-month" type="month" class="period-panel__input" />
          <label class="period-panel__all">
            <input id="period-all" type="checkbox" />
            Ver todos os períodos
          </label>
        </div>
      </header>

      <!-- Navegação por abas -->
      <nav class="tabs" aria-label="Categorias">
        <button class="tab" data-tab="resumo" aria-current="page">
          <span class="tab__icon" aria-hidden="true">🏠</span
          ><span class="tab__label">Resumo</span>
        </button>
        <button class="tab" data-tab="fixo">
          <span class="tab__icon" aria-hidden="true">📌</span
          ><span class="tab__label">Fixos</span>
        </button>
        <button class="tab" data-tab="debito">
          <span class="tab__icon" aria-hidden="true">💳</span
          ><span class="tab__label">Débitos</span>
        </button>
        <button class="tab" data-tab="credito">
          <span class="tab__icon" aria-hidden="true">🧾</span
          ><span class="tab__label">Créditos</span>
        </button>
        <button class="tab" data-tab="entrada">
          <span class="tab__icon" aria-hidden="true">⬆️</span
          ><span class="tab__label">Entradas</span>
        </button>
        <button class="tab" data-tab="caixa">
          <span class="tab__icon" aria-hidden="true">💵</span
          ><span class="tab__label">Caixa</span>
        </button>
      </nav>

      <!-- Conteúdo principal -->
      <main id="main" class="main">
        <!-- ===== RESUMO ===== -->
        <section class="view" id="view-resumo" data-view="resumo">
          <div class="hero-card" id="hero-card">
            <span class="hero-card__label">Saldo em caixa</span>
            <span class="hero-card__value" id="hero-saldo">R$ 0,00</span>
            <span class="hero-card__period" id="hero-period">—</span>
          </div>

          <div class="stat-grid" id="stat-grid"><!-- preenchido via JS --></div>

          <section class="panel">
            <h2 class="panel__title">Por categoria</h2>
            <div id="chart-bars" class="bar-chart">
              <!-- preenchido via JS -->
            </div>
          </section>

          <section class="panel" id="panel-parcelamentos" hidden>
            <div class="panel__header">
              <h2 class="panel__title">Parcelamentos em aberto</h2>
              <span class="panel__badge" id="parcelamentos-total"></span>
            </div>
            <ul id="parcelamentos-list" class="parcela-list">
              <!-- preenchido via JS -->
            </ul>
          </section>

          <section class="panel">
            <div class="panel__header">
              <h2 class="panel__title">Últimos lançamentos</h2>
            </div>
            <ul id="recent-list" class="tx-list">
              <!-- preenchido via JS -->
            </ul>
          </section>
        </section>

        <!-- ===== ABAS DE CATEGORIA (fixo / debito / credito / entrada / caixa) ===== -->
        <template id="tpl-category-view">
          <section class="view" data-view="">
            <div class="cat-summary">
              <div>
                <span class="cat-summary__label">Total no período</span>
                <span class="cat-summary__value">R$ 0,00</span>
              </div>
              <span class="cat-summary__count">0 lançamentos</span>
            </div>

            <div class="filter-row">
              <input
                type="search"
                class="filter-input"
                placeholder="Buscar por motivo, local ou app…"
              />
            </div>

            <ul class="tx-list">
              <!-- preenchido via JS -->
            </ul>
            <p class="empty-state" hidden>Nenhum lançamento neste período.</p>
          </section>
        </template>
      </main>

      <!-- Botão flutuante de novo lançamento -->
      <button
        id="fab-add"
        class="fab"
        type="button"
        aria-label="Novo lançamento"
      >
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <!-- ===== FORMULÁRIO (modal / bottom-sheet) ===== -->
    <dialog id="tx-dialog" class="tx-dialog">
      <form id="tx-form" class="tx-form">
        <header class="tx-form__header">
          <h2 id="tx-form-title">Novo lançamento</h2>
          <button
            type="button"
            id="tx-form-close"
            class="icon-btn"
            aria-label="Fechar"
          >
            ✕
          </button>
        </header>

        <input type="hidden" id="f-id" />

        <div id="parcela-badge" class="parcela-badge" hidden>
          <span id="parcela-badge-text"></span>
          <button
            type="button"
            id="parcela-badge-cancel"
            class="parcela-card__cancel"
          >
            Cancelar restantes
          </button>
        </div>

        <div class="field">
          <label for="f-tipo">Categoria</label>
          <select id="f-tipo" required>
            <option value="Fixo">Gasto fixo</option>
            <option value="Debito">Débito</option>
            <option value="Credito">Crédito</option>
            <option value="Entrada">Entrada</option>
            <option value="Caixa">Caixa</option>
          </select>
        </div>

        <div class="field" id="field-natureza" hidden>
          <label for="f-natureza">Movimento</label>
          <select id="f-natureza">
            <option value="Entrada">Entrada (recebi)</option>
            <option value="Saida">Saída (gastei)</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-data">Data</label>
            <input type="date" id="f-data" required />
          </div>
          <div class="field">
            <label for="f-valor" id="label-valor">Valor (R$)</label>
            <input
              type="number"
              id="f-valor"
              inputmode="decimal"
              step="0.01"
              min="0"
              placeholder="0,00"
              required
            />
          </div>
        </div>

        <div class="field field--checkbox" id="field-parcelado-wrap">
          <label class="checkbox-label">
            <input type="checkbox" id="f-parcelado" />
            Compra parcelada <span class="field-optional">(opcional)</span>
          </label>
        </div>

        <div class="field-row" id="field-parcelas" hidden>
          <div class="field">
            <label for="f-parcelas-total">Nº de parcelas</label>
            <input
              type="number"
              id="f-parcelas-total"
              min="2"
              max="360"
              step="1"
              placeholder="Ex.: 10"
            />
          </div>
          <div class="field">
            <label for="f-parcela-atual">Parcela inicial</label>
            <input
              type="number"
              id="f-parcela-atual"
              min="1"
              max="360"
              step="1"
              value="1"
            />
          </div>
        </div>
        <p class="field-hint" id="parcelas-hint" hidden></p>

        <div class="field">
          <label for="f-motivo">Motivo</label>
          <input
            type="text"
            id="f-motivo"
            list="dados-list"
            placeholder="Ex.: Mercado, Salário, Assinatura…"
            required
          />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-local">Local</label>
            <input
              type="text"
              id="f-local"
              placeholder="Ex.: Supermercado, iFood…"
            />
          </div>
          <div class="field">
            <label for="f-aplicativo">Aplicativo / conta</label>
            <input
              type="text"
              id="f-aplicativo"
              list="dados-list"
              placeholder="Ex.: Nubank, Pix…"
            />
          </div>
        </div>

        <datalist id="dados-list"><!-- preenchido via JS --></datalist>

        <footer class="tx-form__footer">
          <button
            type="button"
            id="tx-form-delete"
            class="btn btn--danger"
            hidden
          >
            Excluir
          </button>
          <button type="submit" class="btn btn--primary">Salvar</button>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
